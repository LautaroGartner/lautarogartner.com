<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660"><rect width="1600" height="660" fill="#f0eee8"/><text x="48" y="88" font-family="Arial,sans-serif" font-size="46" font-weight="600" fill="#1c1d20">Four separate checks</text><rect x="48" y="155" width="342" height="310" rx="12" fill="#e7e4dc"/><circle cx="97" cy="210" r="25" fill="#3043ce"/><text x="97" y="220" text-anchor="middle" font-family="Arial" font-size="28" fill="white">1</text><text x="73" y="290" font-family="Arial" font-size="34" fill="#1c1d20" font-weight="600">Attempt</text><text x="73" y="350" font-family="Arial" font-size="28" fill="#55534f">The visitor presses</text><text x="73" y="392" font-family="Arial" font-size="28" fill="#55534f">the submit button.</text><path d="M 403 306 h 21 m -8 -7 l 8 7 -8 7" stroke="#77736c" stroke-width="2" fill="none"/><rect x="438" y="155" width="342" height="310" rx="12" fill="#e7e4dc"/><circle cx="487" cy="210" r="25" fill="#3043ce"/><text x="487" y="220" text-anchor="middle" font-family="Arial" font-size="28" fill="white">2</text><text x="463" y="290" font-family="Arial" font-size="34" fill="#1c1d20" font-weight="600">Acceptance</text><text x="463" y="350" font-family="Arial" font-size="28" fill="#55534f">The system accepts</text><text x="463" y="392" font-family="Arial" font-size="28" fill="#55534f">the submission.</text><path d="M 793 306 h 21 m -8 -7 l 8 7 -8 7" stroke="#77736c" stroke-width="2" fill="none"/><rect x="828" y="155" width="342" height="310" rx="12" fill="#e7e4dc"/><circle cx="877" cy="210" r="25" fill="#3043ce"/><text x="877" y="220" text-anchor="middle" font-family="Arial" font-size="28" fill="white">3</text><text x="853" y="290" font-family="Arial" font-size="34" fill="#1c1d20" font-weight="600">Receipt</text><text x="853" y="350" font-family="Arial" font-size="28" fill="#55534f">Check whether the</text><text x="853" y="392" font-family="Arial" font-size="28" fill="#55534f">message arrived.</text><path d="M 1183 306 h 21 m -8 -7 l 8 7 -8 7" stroke="#77736c" stroke-width="2" fill="none"/><rect x="1218" y="155" width="342" height="310" rx="12" fill="#e7e4dc"/><circle cx="1267" cy="210" r="25" fill="#3043ce"/><text x="1267" y="220" text-anchor="middle" font-family="Arial" font-size="28" fill="white">4</text><text x="1243" y="290" font-family="Arial" font-size="34" fill="#1c1d20" font-weight="600">Real enquiry</text><text x="1243" y="350" font-family="Arial" font-size="28" fill="#55534f">Review whether it</text><text x="1243" y="392" font-family="Arial" font-size="28" fill="#55534f">fits the service.</text><text x="48" y="555" font-family="Arial" font-size="34" fill="#3043ce">Evidence for one step does not confirm the next.</text><text x="48" y="610" font-family="Arial" font-size="25" fill="#77736c">lautarogartner.com</text></svg>